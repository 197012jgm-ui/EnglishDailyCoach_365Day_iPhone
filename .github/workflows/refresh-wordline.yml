name: One-time Wordline update

on:
  push:
    paths:
      - .github/workflows/refresh-wordline.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified index.html
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip
          payload = ""
          raw = gzip.decompress(base64.b64decode(payload))
          open("index.html", "wb").write(raw)
          PYCODE
      - name: Commit updated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Polish iPhone pronunciation practice"
          git push
